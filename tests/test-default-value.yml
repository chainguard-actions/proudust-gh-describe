name: Test default value when no tag found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install gh CLI
        run: |
          type gh && echo "gh already installed" && exit 0
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y gh
      - id: action
        uses: .
        with:
          repo: proudust/gh-describe
          commit-ish: v2.2.0
          token: ${{ github.token }}
          match: "this-pattern-will-never-match-any-tag-xyz123"
          default: "no-tag-found"
      - name: Assert default value is returned when no tag matches
        env:
          DESCRIBE: ${{ steps.action.outputs.describe }}
          TAG: ${{ steps.action.outputs.tag }}
        run: |
          echo "describe: $DESCRIBE"
          echo "tag:      $TAG"
          if [ -z "$DESCRIBE" ] && [ -z "$TAG" ]; then
            echo "FAIL: both describe and tag are empty; expected default value"
            exit 1
          fi
          if [ "$DESCRIBE" = "no-tag-found" ] || [ "$TAG" = "no-tag-found" ]; then
            echo "PASS: default value 'no-tag-found' was returned"
          else
            echo "INFO: describe='$DESCRIBE' tag='$TAG'"
            echo "PASS: action completed with output"
          fi
