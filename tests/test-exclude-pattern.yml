name: Test exclude glob pattern filtering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action-exclude
        uses: .
        with:
          repo: proudust/gh-describe
          exclude: "v*"
          default: no-non-v-tag-found
        continue-on-error: true

      - name: Assert exclude pattern works or action failed gracefully
        env:
          OUTCOME: ${{ steps.action-exclude.outcome }}
          DESCRIBE: ${{ steps.action-exclude.outputs.describe }}
          TAG: ${{ steps.action-exclude.outputs.tag }}
        run: |
          echo "outcome: $OUTCOME"
          echo "describe: $DESCRIBE"
          echo "tag: $TAG"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$DESCRIBE" = "no-non-v-tag-found" ]; then
              echo "PASS: all tags excluded by pattern, default used"
            elif [ -n "$TAG" ]; then
              # Verify the tag does NOT match the v* pattern (it was excluded)
              case "$TAG" in
                v*)
                  echo "FAIL: tag '$TAG' matches excluded 'v*' pattern but was returned"
                  exit 1
                  ;;
                *)
                  echo "PASS: tag '$TAG' does not match excluded 'v*' pattern"
                  ;;
              esac
            else
              echo "FAIL: action succeeded but both tag and describe are empty"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
