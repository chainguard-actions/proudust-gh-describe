name: Test exclude pattern for tag filtering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install gh CLI
        run: |
          if ! command -v gh &>/dev/null; then
            type -p curl >/dev/null || (apt-get update && apt-get install -y curl)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update
            apt-get install -y gh
          fi
          gh --version
      - id: action-with-exclude
        uses: .
        with:
          token: ${{ github.token }}
          repo: proudust/gh-describe
          commit-ish: v2.1.2
          exclude: "v2.1.2"
      - name: Assert excluded tag is not returned
        env:
          TAG: ${{ steps.action-with-exclude.outputs.tag }}
          DESCRIBE: ${{ steps.action-with-exclude.outputs.describe }}
        run: |
          echo "tag with exclude: $TAG"
          echo "describe with exclude: $DESCRIBE"
          if [ "$TAG" = "v2.1.2" ]; then
            echo "FAIL: tag 'v2.1.2' should have been excluded"
            exit 1
          fi
          echo "PASS: tag '$TAG' is not the excluded tag 'v2.1.2'"
