name: Test exclude pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gh CLI if not present
        run: |
          if ! command -v gh &>/dev/null; then
            type -p curl >/dev/null || (apt-get update && apt-get install -y curl)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
              dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
              tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update && apt-get install -y gh
          fi
          gh --version

      - id: describe
        uses: .
        with:
          token: ${{ github.token }}
          repo: proudust/gh-describe
          commit-ish: v2.1.1
          exclude: "*"
          default: "no-tag-found"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert describe output uses default when all tags are excluded
        env:
          DESCRIBE: ${{ steps.describe.outputs.describe }}
        run: |
          echo "describe: $DESCRIBE"
          # When all tags are excluded, the action should use the default value
          if [ "$DESCRIBE" != "no-tag-found" ]; then
            echo "FAIL: expected 'no-tag-found' but got '$DESCRIBE'"
            exit 1
          fi
          echo "PASS: describe output is the default value when all tags excluded"

      - name: Assert sha is still populated even when tags are excluded
        env:
          SHA: ${{ steps.describe.outputs.sha }}
        run: |
          echo "sha: $SHA"
          if [ -z "$SHA" ]; then
            echo "FAIL: sha output is empty"
            exit 1
          fi
          echo "PASS: sha is populated"
