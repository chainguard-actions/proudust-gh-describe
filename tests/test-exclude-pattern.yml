name: Test exclude pattern filtering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Ensure gh CLI is available
        run: |
          if ! command -v gh &>/dev/null; then
            apt-get update -qq && apt-get install -y -qq gh
          fi
          gh --version

      - id: describe-excluded
        uses: .
        with:
          token: ${{ github.token }}
          repo: proudust/gh-describe
          commit-ish: v2.2.0
          exclude: "v*"
          default: "all-tags-excluded"

      - name: Assert describe falls back to default when all tags are excluded
        env:
          ACTUAL: ${{ steps.describe-excluded.outputs.describe }}
        run: |
          echo "describe: $ACTUAL"
          if [ "$ACTUAL" != "all-tags-excluded" ]; then
            echo "FAIL: expected 'all-tags-excluded' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
