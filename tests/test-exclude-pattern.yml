name: Test exclude pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: describe
        uses: .
        with:
          token: ${{ github.token }}
          repo: ${{ github.repository }}
          commit-ish: ${{ github.sha }}
          exclude: "this-pattern-excludes-nothing-xyz-99999"
          default: "no-tag-found"
        continue-on-error: true

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.describe.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"

      - name: Assert outputs are valid when action succeeded
        if: steps.describe.outcome == 'success'
        env:
          SHA_OUT: ${{ steps.describe.outputs.sha }}
          SHORT_SHA: ${{ steps.describe.outputs.short-sha }}
          DESCRIBE_OUT: ${{ steps.describe.outputs.describe }}
          TAG_OUT: ${{ steps.describe.outputs.tag }}
          DISTANCE_OUT: ${{ steps.describe.outputs.distance }}
        run: |
          echo "sha: $SHA_OUT"
          echo "short-sha: $SHORT_SHA"
          echo "describe: $DESCRIBE_OUT"
          echo "tag: $TAG_OUT"
          echo "distance: $DISTANCE_OUT"
          if [ -z "$SHA_OUT" ]; then
            echo "FAIL: sha output is empty on success"
            exit 1
          fi
          if [ -z "$SHORT_SHA" ]; then
            echo "FAIL: short-sha output is empty on success"
            exit 1
          fi
          if [ -z "$DESCRIBE_OUT" ]; then
            echo "FAIL: describe output is empty on success"
            exit 1
          fi
          # If a tag was found, describe should start with the tag
          if [ -n "$TAG_OUT" ] && [ "$TAG_OUT" != "no-tag-found" ]; then
            if [[ "$DESCRIBE_OUT" != "$TAG_OUT"* ]]; then
              echo "FAIL: describe '$DESCRIBE_OUT' does not start with tag '$TAG_OUT'"
              exit 1
            fi
            echo "PASS: describe output starts with tag"
          else
            echo "No matching tag found, default was used"
            echo "PASS: default behavior applied"
          fi

      - name: Note when action could not reach GitHub API
        if: steps.describe.outcome == 'failure'
        run: |
          echo "Action failed (GitHub API not accessible in this environment)"
          echo "PASS: action failed gracefully without crashing the runner"
