name: Test match pattern filtering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Ensure gh CLI is available
        run: |
          if ! command -v gh &>/dev/null; then
            apt-get update -qq && apt-get install -y -qq gh
          fi
          gh --version

      - id: describe-matched
        uses: .
        with:
          token: ${{ github.token }}
          repo: proudust/gh-describe
          commit-ish: v2.2.0
          match: "v*"

      - name: Assert describe output matches v-prefixed tag
        env:
          ACTUAL: ${{ steps.describe-matched.outputs.describe }}
        run: |
          echo "describe: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected describe to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert tag starts with v
        env:
          ACTUAL: ${{ steps.describe-matched.outputs.tag }}
        run: |
          echo "tag: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^v'; then
            echo "FAIL: expected tag to start with 'v' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"

      - id: describe-no-match
        uses: .
        with:
          token: ${{ github.token }}
          repo: proudust/gh-describe
          commit-ish: v2.2.0
          match: "nonexistent-prefix-*"
          default: "no-matching-tag"

      - name: Assert describe falls back to default when no tag matches
        env:
          ACTUAL: ${{ steps.describe-no-match.outputs.describe }}
        run: |
          echo "describe: $ACTUAL"
          if [ "$ACTUAL" != "no-matching-tag" ]; then
            echo "FAIL: expected 'no-matching-tag' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
