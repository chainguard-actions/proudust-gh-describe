name: Test match pattern filtering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-match
        uses: .
        with:
          repo: proudust/gh-describe
          commit-ish: v2.2.1
          match: "v*"
        continue-on-error: true
      - name: Assert match pattern outputs
        env:
          OUTCOME: ${{ steps.action-match.outcome }}
          TAG: ${{ steps.action-match.outputs.tag }}
          DESCRIBE: ${{ steps.action-match.outputs.describe }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tag: $TAG"
          echo "describe: $DESCRIBE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TAG" ]; then
              echo "FAIL: action succeeded but tag output is empty"
              exit 1
            fi
            # Tag should match the v* pattern
            case "$TAG" in
              v*)
                echo "PASS: tag '$TAG' matches v* pattern"
                ;;
              *)
                echo "FAIL: tag '$TAG' does not match v* pattern"
                exit 1
                ;;
            esac
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API or network issue in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
