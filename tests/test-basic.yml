name: Test basic usage with explicit repo
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo: proudust/gh-describe
          commit-ish: v2.2.1
        continue-on-error: true
      - name: Assert outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DESCRIBE: ${{ steps.action.outputs.describe }}
          TAG: ${{ steps.action.outputs.tag }}
          DISTANCE: ${{ steps.action.outputs.distance }}
          SHA: ${{ steps.action.outputs.sha }}
          SHORT_SHA: ${{ steps.action.outputs.short-sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "describe: $DESCRIBE"
          echo "tag: $TAG"
          echo "distance: $DISTANCE"
          echo "sha: $SHA"
          echo "short-sha: $SHORT_SHA"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$TAG" ]; then
              echo "FAIL: action succeeded but tag output is empty"
              exit 1
            fi
            echo "PASS: got tag '$TAG', describe '$DESCRIBE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (API or network issue in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
