name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gh CLI if not present
        run: |
          if ! command -v gh &>/dev/null; then
            type -p curl >/dev/null || (apt-get update && apt-get install -y curl)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
              dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
              tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update && apt-get install -y gh
          fi
          gh --version

      - id: describe
        uses: .
        with:
          token: ${{ github.token }}
          repo: proudust/gh-describe
          commit-ish: v2.1.1
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert sha output is populated
        env:
          SHA: ${{ steps.describe.outputs.sha }}
        run: |
          echo "sha: $SHA"
          if [ -z "$SHA" ]; then
            echo "FAIL: sha output is empty"
            exit 1
          fi
          echo "PASS: sha is populated"

      - name: Assert short-sha output is populated
        env:
          SHORT_SHA: ${{ steps.describe.outputs.short-sha }}
        run: |
          echo "short-sha: $SHORT_SHA"
          if [ -z "$SHORT_SHA" ]; then
            echo "FAIL: short-sha output is empty"
            exit 1
          fi
          echo "PASS: short-sha is populated"

      - name: Assert describe output is populated
        env:
          DESCRIBE: ${{ steps.describe.outputs.describe }}
        run: |
          echo "describe: $DESCRIBE"
          if [ -z "$DESCRIBE" ]; then
            echo "FAIL: describe output is empty"
            exit 1
          fi
          echo "PASS: describe is populated"

      - name: Assert tag output is populated
        env:
          TAG: ${{ steps.describe.outputs.tag }}
        run: |
          echo "tag: $TAG"
          if [ -z "$TAG" ]; then
            echo "FAIL: tag output is empty"
            exit 1
          fi
          echo "PASS: tag is populated"

      - name: Assert distance output is a number
        env:
          DISTANCE: ${{ steps.describe.outputs.distance }}
        run: |
          echo "distance: $DISTANCE"
          if ! echo "$DISTANCE" | grep -qE '^[0-9]+$'; then
            echo "FAIL: distance is not a non-negative integer: '$DISTANCE'"
            exit 1
          fi
          echo "PASS: distance is a valid number"

      - name: Assert describe matches expected format for v2.1.1
        env:
          DESCRIBE: ${{ steps.describe.outputs.describe }}
          TAG: ${{ steps.describe.outputs.tag }}
        run: |
          echo "describe: $DESCRIBE"
          echo "tag: $TAG"
          # When commit-ish is a tag, describe should start with that tag
          if ! echo "$DESCRIBE" | grep -qE '^v2\.1\.1'; then
            echo "FAIL: describe '$DESCRIBE' does not start with 'v2.1.1'"
            exit 1
          fi
          echo "PASS: describe starts with expected tag"
