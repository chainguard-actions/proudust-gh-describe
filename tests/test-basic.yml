name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock gh CLI
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/gh << 'MOCKEOF'
          #!/bin/sh
          ARGS="$*"
          if echo "$ARGS" | grep -q "graphql"; then
            echo '{"data":{"repository":{"object":{"history":{"totalCount":1}}}}}'
          elif echo "$ARGS" | grep -qE "repos/[^/?]+/[^/?]+/tags"; then
            echo '["abc1234567890123456789012345678901234567890","v2.1.0"]'
          elif echo "$ARGS" | grep -qE "repos/[^/?]+/[^/?]+/commits"; then
            echo "abc1234567890123456789012345678901234567890"
          else
            echo "mock gh: unhandled args: $ARGS" >&2
            exit 1
          fi
          MOCKEOF
          chmod +x /tmp/mock-bin/gh
          cp /tmp/mock-bin/gh /usr/local/bin/gh
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"

      - id: describe
        uses: .
        with:
          token: fake-token-for-testing
          repo: proudust/gh-describe
          commit-ish: refs/heads/main

      - name: Assert describe is non-empty
        env:
          DESCRIBE: ${{ steps.describe.outputs.describe }}
        run: |
          echo "describe: $DESCRIBE"
          if [ -z "$DESCRIBE" ]; then
            echo "FAIL: describe output is empty"
            exit 1
          fi
          echo "PASS: describe is non-empty"

      - name: Assert tag is non-empty
        env:
          TAG: ${{ steps.describe.outputs.tag }}
        run: |
          echo "tag: $TAG"
          if [ -z "$TAG" ]; then
            echo "FAIL: tag output is empty"
            exit 1
          fi
          echo "PASS: tag is non-empty"

      - name: Assert sha is non-empty
        env:
          SHA: ${{ steps.describe.outputs.sha }}
        run: |
          echo "sha: $SHA"
          if [ -z "$SHA" ]; then
            echo "FAIL: sha output is empty"
            exit 1
          fi
          echo "PASS: sha is non-empty"

      - name: Assert short-sha is non-empty
        env:
          SHORT_SHA: ${{ steps.describe.outputs.short-sha }}
        run: |
          echo "short-sha: $SHORT_SHA"
          if [ -z "$SHORT_SHA" ]; then
            echo "FAIL: short-sha output is empty"
            exit 1
          fi
          echo "PASS: short-sha is non-empty"

      - name: Assert distance is a number
        env:
          DISTANCE: ${{ steps.describe.outputs.distance }}
        run: |
          echo "distance: $DISTANCE"
          if ! echo "$DISTANCE" | grep -qE '^[0-9]+$'; then
            echo "FAIL: distance is not a non-negative integer: $DISTANCE"
            exit 1
          fi
          echo "PASS: distance is a number"

      - name: Assert tag equals v2.1.0
        env:
          TAG: ${{ steps.describe.outputs.tag }}
        run: |
          echo "tag: $TAG"
          if [ "$TAG" != "v2.1.0" ]; then
            echo "FAIL: expected tag 'v2.1.0', got '$TAG'"
            exit 1
          fi
          echo "PASS: tag is v2.1.0"
