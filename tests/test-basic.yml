name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Ensure gh CLI is available
        run: |
          if ! command -v gh &>/dev/null; then
            apt-get update -qq && apt-get install -y -qq gh
          fi
          gh --version

      - id: describe
        uses: .
        with:
          token: ${{ github.token }}
          repo: proudust/gh-describe
          commit-ish: v2.2.0

      - name: Assert sha output is non-empty
        env:
          ACTUAL: ${{ steps.describe.outputs.sha }}
        run: |
          echo "sha: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected sha to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert short-sha output is non-empty
        env:
          ACTUAL: ${{ steps.describe.outputs.short-sha }}
        run: |
          echo "short-sha: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected short-sha to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert describe output is non-empty
        env:
          ACTUAL: ${{ steps.describe.outputs.describe }}
        run: |
          echo "describe: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected describe to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert tag output is non-empty
        env:
          ACTUAL: ${{ steps.describe.outputs.tag }}
        run: |
          echo "tag: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected tag to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert distance output is a number
        env:
          ACTUAL: ${{ steps.describe.outputs.distance }}
        run: |
          echo "distance: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected distance to be a non-negative integer, got: $ACTUAL"
            exit 1
          fi
          echo "PASS"

      - name: Assert tag is v2.2.0
        env:
          ACTUAL: ${{ steps.describe.outputs.tag }}
        run: |
          echo "tag: $ACTUAL"
          if [ "$ACTUAL" != "v2.2.0" ]; then
            echo "FAIL: expected tag to be 'v2.2.0' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
