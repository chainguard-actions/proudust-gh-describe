name: Test default fallback value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock gh CLI (returns no tags)
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/gh << 'MOCKEOF'
          #!/bin/sh
          ARGS="$*"
          if echo "$ARGS" | grep -q "graphql"; then
            echo '{"data":{"repository":{"object":{"history":{"totalCount":1}}}}}'
          elif echo "$ARGS" | grep -qE "repos/[^/?]+/[^/?]+/tags"; then
            echo ""
          elif echo "$ARGS" | grep -qE "repos/[^/?]+/[^/?]+/commits"; then
            echo "abc1234567890123456789012345678901234567890"
          else
            echo "mock gh: unhandled args: $ARGS" >&2
            exit 1
          fi
          MOCKEOF
          chmod +x /tmp/mock-bin/gh
          cp /tmp/mock-bin/gh /usr/local/bin/gh
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"

      - id: describe
        uses: .
        with:
          token: fake-token-for-testing
          repo: proudust/gh-describe
          commit-ish: refs/heads/main
          default: "fallback-value"

      - name: Assert describe output uses default when no tag found
        env:
          DESCRIBE: ${{ steps.describe.outputs.describe }}
        run: |
          echo "describe: $DESCRIBE"
          if [ "$DESCRIBE" != "fallback-value" ]; then
            echo "FAIL: expected describe to be 'fallback-value', got '$DESCRIBE'"
            exit 1
          fi
          echo "PASS: describe uses default fallback value"

      - name: Assert tag output uses default when no tag found
        env:
          TAG: ${{ steps.describe.outputs.tag }}
        run: |
          echo "tag: $TAG"
          if [ "$TAG" != "fallback-value" ]; then
            echo "FAIL: expected tag to be 'fallback-value', got '$TAG'"
            exit 1
          fi
          echo "PASS: tag uses default fallback value"

      - name: Assert sha is still populated even with no matching tag
        env:
          SHA: ${{ steps.describe.outputs.sha }}
        run: |
          echo "sha: $SHA"
          if [ -z "$SHA" ]; then
            echo "FAIL: sha output is empty even with default fallback"
            exit 1
          fi
          echo "PASS: sha is non-empty"
