name: Test default fallback
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gh CLI if not present
        run: |
          if ! command -v gh &>/dev/null; then
            type -p curl >/dev/null || (apt-get update && apt-get install -y curl)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
              dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
              tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update && apt-get install -y gh
          fi
          gh --version

      - id: describe
        uses: .
        with:
          token: ${{ github.token }}
          repo: proudust/gh-describe
          commit-ish: v2.1.1
          match: "this-pattern-will-never-match-any-tag-xyz123"
          default: "fallback-value"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert describe output uses default when no tag matches
        env:
          DESCRIBE: ${{ steps.describe.outputs.describe }}
        run: |
          echo "describe: $DESCRIBE"
          # When no tag matches the pattern, the action should use the default value
          if [ "$DESCRIBE" != "fallback-value" ]; then
            echo "FAIL: expected 'fallback-value' but got '$DESCRIBE'"
            exit 1
          fi
          echo "PASS: describe output is the default fallback value"

      - name: Assert tag output uses default when no tag matches
        env:
          TAG: ${{ steps.describe.outputs.tag }}
        run: |
          echo "tag: $TAG"
          if [ "$TAG" != "fallback-value" ]; then
            echo "FAIL: expected tag 'fallback-value' but got '$TAG'"
            exit 1
          fi
          echo "PASS: tag output is the default fallback value"

      - name: Assert distance is zero when using default
        env:
          DISTANCE: ${{ steps.describe.outputs.distance }}
        run: |
          echo "distance: $DISTANCE"
          if [ "$DISTANCE" != "0" ]; then
            echo "FAIL: expected distance '0' but got '$DISTANCE'"
            exit 1
          fi
          echo "PASS: distance is 0 when using default"
