name: Test exclude pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gh CLI if not present
        run: |
          if ! command -v gh &>/dev/null; then
            type -p curl >/dev/null || (apt-get update && apt-get install -y curl)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
              dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
              tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update && apt-get install -y gh
          fi
          gh --version

      - id: action
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          repo: actions/checkout
          commit-ish: main
          exclude: "*"
          default: "excluded-fallback"

      - name: Assert describe uses default when all tags are excluded
        env:
          DESCRIBE: ${{ steps.action.outputs.describe }}
        run: |
          echo "describe: $DESCRIBE"
          if [ "$DESCRIBE" != "excluded-fallback" ]; then
            echo "FAIL: expected describe to be 'excluded-fallback' but got '$DESCRIBE'"
            exit 1
          fi
          echo "PASS: describe correctly uses default value when all tags excluded"
