name: Test sha output format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install gh CLI if not present
        run: |
          if ! command -v gh &>/dev/null; then
            type -p curl >/dev/null || (apt-get update && apt-get install -y curl)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
              dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
              tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update && apt-get install -y gh
          fi
          gh --version

      - id: action
        uses: .
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          token: ${{ github.token }}
          repo: actions/checkout
          commit-ish: main
          default: "no-tag"

      - name: Assert sha is a 40-character hex string
        env:
          SHA: ${{ steps.action.outputs.sha }}
        run: |
          echo "sha: $SHA"
          if ! echo "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "FAIL: expected sha to be a 40-character hex string, got: '$SHA'"
            exit 1
          fi
          echo "PASS: sha is a valid 40-character hex string"

      - name: Assert short-sha is a shorter hex string
        env:
          SHORT_SHA: ${{ steps.action.outputs.short-sha }}
        run: |
          echo "short-sha: $SHORT_SHA"
          if ! echo "$SHORT_SHA" | grep -qE '^[0-9a-f]{7,}$'; then
            echo "FAIL: expected short-sha to be a hex string of at least 7 chars, got: '$SHORT_SHA'"
            exit 1
          fi
          echo "PASS: short-sha is a valid hex string"

      - name: Assert sha starts with short-sha
        env:
          SHA: ${{ steps.action.outputs.sha }}
          SHORT_SHA: ${{ steps.action.outputs.short-sha }}
        run: |
          echo "sha: $SHA"
          echo "short-sha: $SHORT_SHA"
          if ! echo "$SHA" | grep -q "^$SHORT_SHA"; then
            echo "FAIL: expected sha to start with short-sha"
            exit 1
          fi
          echo "PASS: sha starts with short-sha"
